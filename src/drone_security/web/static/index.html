<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drone Security Analyst</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='5' fill='%236d8cff'/><g stroke='%236d8cff' stroke-width='3'><path d='M5 5l7 7M27 5l-7 7M5 27l7-7M27 27l-7-7'/></g></svg>">
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/vendor/chart.umd.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/live" title="Back to the live view">
      <span class="logo"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="4.5"/><path d="M6 6l7 7M26 6l-7 7M6 26l7-7M26 26l-7-7"/><circle cx="6" cy="6" r="3.5"/><circle cx="26" cy="6" r="3.5"/><circle cx="6" cy="26" r="3.5"/><circle cx="26" cy="26" r="3.5"/></svg></span>
      <span><strong>Drone Security Analyst</strong><span id="property-name">Loading…</span></span>
    </a>
    <nav id="nav" class="tabs" aria-label="Sections"></nav>
    <div class="top-actions">
      <a id="replay-mini" class="replay-mini" href="#/live" hidden></a>
      <span id="mode-badge" class="badge">…</span>
      <button id="theme-btn" class="icon-btn" title="Light / dark theme" aria-label="Toggle light or dark theme"></button>
      <button id="demo-btn" class="btn btn-accent" title="Guided walkthrough for the demo video (D)">&#9654; Demo</button>
    </div>
  </header>
  <div class="subnav">
    <nav id="subtabs" class="subtabs" aria-label="Views"></nav>
    <button id="help-btn" class="help-btn" aria-expanded="false" aria-controls="help-pop">&#9432; What am I looking at?</button>
    <div id="help-pop" class="help-pop" hidden></div>
  </div>
  <main id="view" tabindex="-1"></main>

  <!-- frame detail drawer, shared by every view -->
  <div id="drawer" class="drawer" hidden role="dialog" aria-modal="true" aria-labelledby="drawer-title">
    <div class="drawer-backdrop" data-close></div>
    <section class="drawer-panel">
      <header><h2 id="drawer-title">Frame</h2><button class="icon-btn" data-close aria-label="Close">&#10005;</button></header>
      <div id="drawer-body"></div>
    </section>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="demo" class="demo" hidden></div>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
